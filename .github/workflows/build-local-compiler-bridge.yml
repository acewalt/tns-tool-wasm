name: Build self-contained TNS compiler

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-local-compiler-bridge.yml'
      - 'tools/tns-tool-compiler-bridge/**'
      - 'ndless-local-bridge.js'
      - 'ndless-build-manager.js'
      - 'ndless-build-ui.js'

permissions:
  contents: write

concurrency:
  group: tns-tool-self-contained-compiler
  cancel-in-progress: true

env:
  COMPILER_TAG: tns-tool-compiler-v1
  ARM_VERSION: 14.3.rel1
  NDLESS_REF: r2022

jobs:
  prepare-ndless:
    name: Prepare Ndless runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl xz-utils unzip zip php-cli \
            libboost-program-options-dev zlib1g-dev

      - name: Download GNU Arm toolchain
        shell: bash
        run: |
          set -euo pipefail
          url="https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/${ARM_VERSION}/binrel/arm-gnu-toolchain-${ARM_VERSION}-x86_64-arm-none-eabi.tar.xz"
          curl -L --fail --retry 3 "$url" -o arm-toolchain.tar.xz
          mkdir -p .toolchain
          tar -xJf arm-toolchain.tar.xz -C .toolchain --strip-components=1
          .toolchain/bin/arm-none-eabi-gcc --version | head -1

      - name: Checkout Ndless r2022
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$NDLESS_REF" --recurse-submodules https://github.com/ndless-nspire/Ndless.git .ndless
          test -f .ndless/ndless-sdk/include/libndls.h

      - name: Build ARM Ndless libraries
        shell: bash
        run: |
          set -euo pipefail
          SDK="$GITHUB_WORKSPACE/.ndless/ndless-sdk"
          ARM="$GITHUB_WORKSPACE/.toolchain"
          export _NDLESS_TOOLCHAIN_PATH="$ARM/bin"
          export PATH="$SDK/bin:$ARM/bin:$PATH"

          make -C "$SDK/libsyscalls" -j2
          make -C "$SDK/libndls" -j2
          make -C "$SDK/thirdparty" -j2
          make -C "$SDK/system" -j2

          test -f "$SDK/lib/libsyscalls.a"
          test -f "$SDK/lib/libndls.a"
          test -f "$SDK/lib/libnspireio.a"
          test -f "$SDK/system/crt0.o"
          test -f "$SDK/system/ldscript"

      - name: Build Linux genzehn
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.ndless/ndless-sdk/tools/genzehn"
          mkdir -p dist-common/linux-bin
          g++ -O2 -Wall -Wextra -std=c++11 -static -static-libgcc -static-libstdc++ -I "$SRC/elfio-3.2" \
            "$SRC/genzehn.cpp" -lboost_program_options -lz \
            -o dist-common/linux-bin/genzehn
          dist-common/linux-bin/genzehn --help >/dev/null || true

      - name: Smoke test GNU Arm + Ndless r2022
        shell: bash
        run: |
          set -euo pipefail
          SDK="$GITHUB_WORKSPACE/.ndless/ndless-sdk"
          ARM="$GITHUB_WORKSPACE/.toolchain"
          export _NDLESS_TOOLCHAIN_PATH="$ARM/bin"
          export PATH="$SDK/bin:$ARM/bin:$PATH"
          mkdir -p smoke
          cat > smoke/main.c <<'EOF'
          #include <stdio.h>
          #include <libndls.h>
          int main(void) {
              assert_ndless_rev(801);
              clrscr();
              printf("Hello Ndless!\n");
              wait_key_pressed();
              return 0;
          }
          EOF
          cd smoke
          nspire-gcc -Wall -W -Os -marm -ffunction-sections -fdata-sections -c main.c -o main.o
          nspire-ld main.o -Wl,--gc-sections -o smoke.elf
          "$GITHUB_WORKSPACE/dist-common/linux-bin/genzehn" --input smoke.elf --output smoke.tns --name smoke --author "TNS Tool" --compress
          python3 - <<'PY'
          from pathlib import Path
          p = Path('smoke.tns')
          b = p.read_bytes()
          assert b[:4] == b'Zehn', b[:16]
          assert len(b) > 32
          print('Smoke TNS:', len(b), 'bytes')
          PY

      - name: Assemble common runtime
        shell: bash
        run: |
          set -euo pipefail
          SDK="$GITHUB_WORKSPACE/.ndless/ndless-sdk"
          mkdir -p dist-common/ndless dist-common/genzehn-src
          cp -a "$SDK/include" dist-common/ndless/
          cp -a "$SDK/lib" dist-common/ndless/
          cp -a "$SDK/system" dist-common/ndless/
          cp -a "$SDK/tools/genzehn/." dist-common/genzehn-src/
          cp .ndless/Mozilla-Public-License-v1.1.html dist-common/ndless/ 2>/dev/null || true
          find dist-common -type f | wc -l
          du -sh dist-common

      - name: Upload common runtime
        uses: actions/upload-artifact@v4
        with:
          name: ndless-common-runtime
          path: dist-common
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Linux x64 AppImage
    needs: prepare-ndless
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ndless-common-runtime
          path: common

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/tns-tool-compiler-bridge

      - name: Download Linux GNU Arm runtime
        shell: bash
        run: |
          set -euo pipefail
          url="https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/${ARM_VERSION}/binrel/arm-gnu-toolchain-${ARM_VERSION}-x86_64-arm-none-eabi.tar.xz"
          curl -L --fail --retry 3 "$url" -o arm-toolchain.tar.xz
          mkdir -p bundle/runtime/toolchain
          tar -xJf arm-toolchain.tar.xz -C bundle/runtime/toolchain --strip-components=1
          rm -rf bundle/runtime/toolchain/share/doc bundle/runtime/toolchain/share/man bundle/runtime/toolchain/share/info
          rm -f bundle/runtime/toolchain/bin/arm-none-eabi-gdb* || true

      - name: Assemble Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/runtime/bin
          cp -a common/ndless bundle/runtime/ndless
          cp common/linux-bin/genzehn bundle/runtime/bin/genzehn
          chmod +x bundle/runtime/bin/genzehn
          bundle/runtime/toolchain/bin/arm-none-eabi-gcc --version | head -1
          bundle/runtime/bin/genzehn --help >/dev/null || true
          du -sh bundle/runtime

      - name: Build compiler bridge
        run: cargo build --release --manifest-path tools/tns-tool-compiler-bridge/Cargo.toml

      - name: Smoke test local compiler
        shell: bash
        env:
          TNS_TOOL_RUNTIME_ROOT: ${{ github.workspace }}/bundle/runtime
        run: |
          set -euo pipefail
          mkdir -p smoke-project
          cat > smoke-project/main.c <<'EOF'
          #include <stdio.h>
          #include <libndls.h>
          int main(void) {
              assert_ndless_rev(801);
              clrscr();
              printf("Hello from local TNS Tool Compiler!\n");
              wait_key_pressed();
              return 0;
          }
          EOF
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('smoke-project.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('smoke-project/main.c', 'main.c')
          PY
          tools/tns-tool-compiler-bridge/target/release/tns-tool-compiler-bridge \
            --build-zip smoke-project.zip smoke-linux.tns smoke-linux
          python3 - <<'PY'
          from pathlib import Path
          b = Path('smoke-linux.tns').read_bytes()
          assert b[:4] == b'Zehn'
          print('Linux compiler smoke:', len(b), 'bytes')
          PY

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          APPDIR="$GITHUB_WORKSPACE/AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/runtime"
          cp tools/tns-tool-compiler-bridge/target/release/tns-tool-compiler-bridge "$APPDIR/usr/bin/tns-tool-compiler-bridge"
          cp -a bundle/runtime/. "$APPDIR/usr/runtime/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export TNS_TOOL_RUNTIME_ROOT="$HERE/usr/runtime"
          export LD_LIBRARY_PATH="$HERE/usr/runtime/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/tns-tool-compiler-bridge" "$@"
          EOF
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/tns-tool-compiler-bridge"
          cat > "$APPDIR/tns-tool-compiler.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=TNS Tool Compiler
          Exec=TNS-Tool-Compiler %u
          Icon=tns-tool-compiler
          Terminal=false
          Categories=Development;
          MimeType=x-scheme-handler/tnstool;
          EOF
          cat > "$APPDIR/tns-tool-compiler.svg" <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="48" fill="#102033"/>
            <path d="M53 70h150v32h-57v98h-36v-98H53z" fill="#66d9ef"/>
          </svg>
          EOF
          ln -s tns-tool-compiler.svg "$APPDIR/.DirIcon"
          curl -L --fail --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o appimagetool.AppImage
          chmod +x appimagetool.AppImage
          mkdir -p dist
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage \
            "$APPDIR" dist/TNS-Tool-Compiler-Linux-x64.AppImage
          chmod +x dist/TNS-Tool-Compiler-Linux-x64.AppImage
          ls -lh dist/TNS-Tool-Compiler-Linux-x64.AppImage

      - name: Smoke test AppImage contents
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE_EXTRACT_AND_RUN=1 dist/TNS-Tool-Compiler-Linux-x64.AppImage --status-json | tee appimage-status.json
          grep -q '"toolchainReady":true' appimage-status.json
          APPIMAGE_EXTRACT_AND_RUN=1 dist/TNS-Tool-Compiler-Linux-x64.AppImage \
            --build-zip smoke-project.zip smoke-appimage.tns smoke-appimage
          python3 - <<'PY'
          from pathlib import Path
          assert Path('smoke-appimage.tns').read_bytes()[:4] == b'Zehn'
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: TNS-Tool-Compiler-Linux-x64
          path: dist/TNS-Tool-Compiler-Linux-x64.AppImage
          retention-days: 14
          if-no-files-found: error

  windows:
    name: Windows x64 EXE
    needs: prepare-ndless
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ndless-common-runtime
          path: common

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/tns-tool-compiler-bridge

      - name: Set up MSYS2 for genzehn
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-zlib

      - name: Build Windows genzehn
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p bundle/runtime/bin
          SRC="$GITHUB_WORKSPACE/common/genzehn-src"
          g++ -O2 -Wall -Wextra -std=c++11 -I "$SRC/elfio-3.2" \
            "$SRC/genzehn.cpp" -static -static-libgcc -static-libstdc++ \
            -lboost_program_options -lz -lws2_32 \
            -o bundle/runtime/bin/genzehn.exe
          bundle/runtime/bin/genzehn.exe --help >/dev/null || true

      - name: Download Windows GNU Arm runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/$env:ARM_VERSION/binrel/arm-gnu-toolchain-$env:ARM_VERSION-mingw-w64-x86_64-arm-none-eabi.zip"
          Invoke-WebRequest -Uri $url -OutFile arm-toolchain.zip
          Expand-Archive -Path arm-toolchain.zip -DestinationPath arm-expanded -Force
          $root = Get-ChildItem arm-expanded -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path bundle/runtime/toolchain | Out-Null
          Copy-Item -Recurse -Force "$($root.FullName)/*" bundle/runtime/toolchain/
          Remove-Item -Recurse -Force bundle/runtime/toolchain/share/doc -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force bundle/runtime/toolchain/share/man -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force bundle/runtime/toolchain/share/info -ErrorAction SilentlyContinue
          Get-ChildItem bundle/runtime/toolchain/bin/arm-none-eabi-gdb* -ErrorAction SilentlyContinue | Remove-Item -Force
          & bundle/runtime/toolchain/bin/arm-none-eabi-gcc.exe --version | Select-Object -First 1

      - name: Assemble Windows runtime
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force common/ndless bundle/runtime/ndless
          Get-ChildItem bundle/runtime -Recurse -File | Measure-Object -Property Length -Sum | ForEach-Object { "Runtime bytes: $($_.Sum)" }

      - name: Build compiler bridge
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --manifest-path tools/tns-tool-compiler-bridge/Cargo.toml

      - name: Pack single Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          python tools/tns-tool-compiler-bridge/pack_runtime.py `
            tools/tns-tool-compiler-bridge/target/release/tns-tool-compiler-bridge.exe `
            bundle/runtime `
            dist/TNS-Tool-Compiler-Windows-x64.exe
          Get-Item dist/TNS-Tool-Compiler-Windows-x64.exe | Format-List Name,Length

      - name: Smoke test packed Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke-project | Out-Null
          @'
          #include <stdio.h>
          #include <libndls.h>
          int main(void) {
              assert_ndless_rev(801);
              clrscr();
              printf("Hello from local TNS Tool Compiler!\n");
              wait_key_pressed();
              return 0;
          }
          '@ | Set-Content -Encoding ascii smoke-project/main.c
          python -c "import zipfile; z=zipfile.ZipFile('smoke-project.zip','w',zipfile.ZIP_DEFLATED); z.write('smoke-project/main.c','main.c'); z.close()"
          & dist/TNS-Tool-Compiler-Windows-x64.exe --build-zip smoke-project.zip smoke-windows.tns smoke-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from pathlib import Path; b=Path('smoke-windows.tns').read_bytes(); assert b[:4] == b'Zehn'; print('Windows compiler smoke:', len(b), 'bytes')"

      - uses: actions/upload-artifact@v4
        with:
          name: TNS-Tool-Compiler-Windows-x64
          path: dist/TNS-Tool-Compiler-Windows-x64.exe
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish self-contained compiler
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TNS-Tool-Compiler-*
          path: dist
          merge-multiple: true

      - name: Build manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          files=[]
          for p in sorted(Path('dist').iterdir()):
              if not p.is_file(): continue
              data=p.read_bytes()
              files.append({'name':p.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          Path('dist/compiler-manifest.json').write_text(json.dumps({
              'version':1,
              'bridgeProtocol':2,
              'ndless':'r2022',
              'armToolchain':'14.3.rel1',
              'files':files,
          }, indent=2))
          print(json.dumps(files, indent=2))
          PY

      - name: Publish versioned compiler release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$COMPILER_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$COMPILER_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$COMPILER_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'TNS Tool Compiler v1' \
            --notes 'Self-contained local Ndless compiler for TNS Tool. One download per OS: Windows x64 EXE or Linux x64 AppImage. Includes GNU Arm toolchain, Ndless r2022 headers/libraries, and genzehn. The web IDE sends project.zip through 127.0.0.1 and receives a real .tns.'
          gh release upload "$COMPILER_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
