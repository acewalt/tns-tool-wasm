name: Lua runtime compatibility
on:
  push:
    branches: [main]
    paths: ['src/lua/**', 'vendor/luajs/**', 'web/app.js', 'web/ti-cas-preview-bridge-v3.js', 'web/lua-compatibility-report.js', 'tests/lua-*-v45.test.js', 'tests/luajs-core-v45.test.js', '.github/workflows/lua-runtime.yml']
  pull_request:
    paths: ['src/lua/**', 'vendor/luajs/**', 'web/app.js', 'web/ti-cas-preview-bridge-v3.js', 'web/lua-compatibility-report.js', 'tests/lua-*-v45.test.js', 'tests/luajs-core-v45.test.js', '.github/workflows/lua-runtime.yml']
permissions:
  contents: read
jobs:
  lua-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:lua-compat
