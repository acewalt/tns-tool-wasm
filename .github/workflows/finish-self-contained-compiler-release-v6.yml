name: Finish self-healing TNS compiler v3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finish-self-contained-compiler-release-v6.yml'

permissions:
  contents: write

env:
  SOURCE_RUN_ID: '33232126878'
  COMPILER_TAG: tns-tool-compiler-v3
  ARM_VERSION: 14.3.rel1

jobs:
  windows:
    name: Windows x64 self-healing silent EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Patch compiler version and migration behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mainPath = 'tools/tns-tool-compiler-bridge/src/main.rs'
          $cargoPath = 'tools/tns-tool-compiler-bridge/Cargo.toml'
          $main = Get-Content $mainPath -Raw

          $main = $main.Replace('const RUNTIME_VERSION: &str = "runtime-0.2.0";', 'const RUNTIME_VERSION: &str = "runtime-0.2.1";')

          $needle = @'
          use std::process::{Command, Output};
          '@.Trim()
          $replacement = @'
          use std::process::{Command, Output};
          #[cfg(target_os = "windows")]
          use std::os::windows::process::CommandExt;
          #[cfg(target_os = "windows")]
          const CREATE_NO_WINDOW: u32 = 0x08000000;
          '@.Trim()
          if (-not $main.Contains($needle)) { throw 'Could not patch Windows CommandExt import.' }
          $main = $main.Replace($needle, $replacement)

          $needle = @'
          fn run_command(command: &mut Command, log: &mut String, label: &str) -> Result<(), String> {
              log.push_str("$ ");
          '@.Trim()
          $replacement = @'
          fn run_command(command: &mut Command, log: &mut String, label: &str) -> Result<(), String> {
              #[cfg(target_os = "windows")]
              command.creation_flags(CREATE_NO_WINDOW);
              log.push_str("$ ");
          '@.Trim()
          if (-not $main.Contains($needle)) { throw 'Could not patch hidden child process behavior.' }
          $main = $main.Replace($needle, $replacement)

          $needle = @'
              if !same {
                  fs::copy(&current, &target).map_err(|e| format!("Could not install compiler: {e}"))?;
              }
          '@.Trim()
          $replacement = @'
              if !same {
                  // A previous installed compiler can still be serving 34982 and Windows
                  // keeps its executable locked. Stop only our fixed installed filename;
                  // the downloaded updater has a different name and remains alive.
                  if target.exists() {
                      let mut stop = Command::new("taskkill.exe");
                      stop.creation_flags(CREATE_NO_WINDOW)
                          .args(["/IM", "TNS-Tool-Compiler.exe", "/F"]);
                      let _ = stop.status();
                      std::thread::sleep(std::time::Duration::from_millis(500));
                  }
                  fs::copy(&current, &target).map_err(|e| format!("Could not install compiler: {e}"))?;
              }
          '@.Trim()
          if (-not $main.Contains($needle)) { throw 'Could not patch Windows self-update block.' }
          $main = $main.Replace($needle, $replacement)

          $needle = @'
                  let status = Command::new("reg.exe").args(args).status().map_err(|e| e.to_string())?;
          '@.Trim()
          $replacement = @'
                  let mut reg = Command::new("reg.exe");
                  reg.creation_flags(CREATE_NO_WINDOW).args(args);
                  let status = reg.status().map_err(|e| e.to_string())?;
          '@.Trim()
          if (-not $main.Contains($needle)) { throw 'Could not patch hidden registry commands.' }
          $main = $main.Replace($needle, $replacement)

          Set-Content -Path $mainPath -Value $main -Encoding utf8

          $cargo = Get-Content $cargoPath -Raw
          $cargo = $cargo.Replace('version = "0.2.0"', 'version = "0.2.1"')
          Set-Content -Path $cargoPath -Value $cargo -Encoding utf8

          Select-String -Path $mainPath -Pattern 'runtime-0.2.1','CREATE_NO_WINDOW','taskkill.exe'
          Select-String -Path $cargoPath -Pattern 'version = "0.2.1"'

      - name: Reuse validated Ndless runtime
        uses: actions/download-artifact@v4
        with:
          name: ndless-common-runtime
          path: common
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/tns-tool-compiler-bridge

      - name: Set up MSYS2 for genzehn
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-zlib

      - name: Build Windows genzehn and bundle DLLs
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p bundle/runtime/bin
          SRC="$GITHUB_WORKSPACE/common/genzehn-src"
          g++ -O2 -Wall -Wextra -std=c++11 \
            -I "$SRC/elfio-3.2" \
            -I "$GITHUB_WORKSPACE/common/ndless/include" \
            "$SRC/genzehn.cpp" \
            -static-libgcc -static-libstdc++ \
            -lboost_program_options-mt -lz -lws2_32 \
            -o bundle/runtime/bin/genzehn.exe
          ldd bundle/runtime/bin/genzehn.exe \
            | awk '/\/mingw64\/bin\// { for (i=1; i<=NF; i++) if ($i ~ /^\/mingw64\/bin\//) print $i }' \
            | sort -u \
            | while IFS= read -r dll; do [ -n "$dll" ] && cp -v "$dll" bundle/runtime/bin/; done
          bundle/runtime/bin/genzehn.exe --help >/dev/null || true

      - name: Download and trim Windows GNU Arm runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/$env:ARM_VERSION/binrel/arm-gnu-toolchain-$env:ARM_VERSION-mingw-w64-x86_64-arm-none-eabi.zip"
          Invoke-WebRequest -Uri $url -OutFile arm-toolchain.zip
          Expand-Archive -Path arm-toolchain.zip -DestinationPath arm-expanded -Force

          $gcc = Get-ChildItem -Path arm-expanded -Recurse -File -Filter arm-none-eabi-gcc.exe | Select-Object -First 1
          if (-not $gcc) { throw 'arm-none-eabi-gcc.exe was not found inside the Arm GNU ZIP.' }
          $toolchainRoot = Split-Path -Parent (Split-Path -Parent $gcc.FullName)
          New-Item -ItemType Directory -Force -Path bundle/runtime/toolchain | Out-Null
          Get-ChildItem -LiteralPath $toolchainRoot -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination bundle/runtime/toolchain -Recurse -Force
          }

          Remove-Item -Recurse -Force bundle/runtime/toolchain/share -ErrorAction SilentlyContinue
          Get-ChildItem bundle/runtime/toolchain/bin/arm-none-eabi-gdb* -ErrorAction SilentlyContinue | Remove-Item -Force

          $keep = @(
            'arm-none-eabi-gcc.exe',
            'arm-none-eabi-g++.exe',
            'arm-none-eabi-c++.exe',
            'arm-none-eabi-cpp.exe',
            'arm-none-eabi-as.exe',
            'arm-none-eabi-ld.exe',
            'arm-none-eabi-ld.bfd.exe'
          )
          Get-ChildItem bundle/runtime/toolchain/bin -File -Filter '*.exe' | Where-Object {
            $keep -notcontains $_.Name
          } | Remove-Item -Force

          & "$PWD/bundle/runtime/toolchain/bin/arm-none-eabi-gcc.exe" --version | Select-Object -First 1

      - name: Assemble Windows runtime and enforce size ceiling
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force common/ndless bundle/runtime/ndless
          if (-not (Test-Path bundle/runtime/toolchain/bin/arm-none-eabi-gcc.exe)) { throw 'ARM GCC missing' }
          if (-not (Test-Path bundle/runtime/bin/genzehn.exe)) { throw 'genzehn.exe missing' }
          if (-not (Test-Path bundle/runtime/ndless/lib/libndls.a)) { throw 'libndls.a missing' }
          $bytes = (Get-ChildItem bundle/runtime -Recurse -File | Measure-Object -Property Length -Sum).Sum
          "Trimmed runtime bytes: $bytes"
          if ($bytes -ge 1073741824) { throw "Runtime exceeds the embedded 1 GiB extraction ceiling: $bytes bytes" }

      - name: Build self-healing silent compiler bridge
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --manifest-path tools/tns-tool-compiler-bridge/Cargo.toml

      - name: Verify compiler version and Windows GUI subsystem
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import struct; p=Path(r'tools/tns-tool-compiler-bridge/target/release/tns-tool-compiler-bridge.exe'); b=p.read_bytes(); pe=struct.unpack_from('<I',b,0x3c)[0]; subsystem=struct.unpack_from('<H',b,pe+24+68)[0]; print('PE subsystem:',subsystem); assert subsystem==2"
          $out = & tools/tns-tool-compiler-bridge/target/release/tns-tool-compiler-bridge.exe --status-json
          if ($out -notmatch '"version":"0.2.1"') { throw "Expected bridge 0.2.1, got: $out" }

      - name: Pack single Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          python tools/tns-tool-compiler-bridge/pack_runtime.py `
            tools/tns-tool-compiler-bridge/target/release/tns-tool-compiler-bridge.exe `
            bundle/runtime `
            dist/TNS-Tool-Compiler-Windows-x64.exe
          Get-Item dist/TNS-Tool-Compiler-Windows-x64.exe | Format-List Name,Length

      - name: Smoke test packed Windows EXE with fresh runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = "$PWD/smoke-localappdata"
          New-Item -ItemType Directory -Force -Path smoke-project | Out-Null
          @'
          #define OLD_SCREEN_API
          #include <stdio.h>
          #include <libndls.h>
          int main(void) {
              assert_ndless_rev(801);
              clrscr();
              printf("Hello from self-healing local TNS Tool Compiler!\n");
              wait_key_pressed();
              return 0;
          }
          '@ | Set-Content -Encoding ascii smoke-project/main.c
          python -c "import zipfile; z=zipfile.ZipFile('smoke-project.zip','w',zipfile.ZIP_DEFLATED); z.write('smoke-project/main.c','main.c'); z.close()"
          $proc = Start-Process -FilePath "$PWD/dist/TNS-Tool-Compiler-Windows-x64.exe" -ArgumentList '--build-zip','smoke-project.zip','smoke-windows.tns','smoke-windows' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Compiler smoke exited with $($proc.ExitCode)" }
          python -c "from pathlib import Path; b=Path('smoke-windows.tns').read_bytes(); assert b[:4] == b'Zehn'; print('Windows compiler smoke:', len(b), 'bytes')"
          if (-not (Test-Path "$env:LOCALAPPDATA/TNS Tool Compiler/runtime/runtime-0.2.1/.bundle-version")) { throw 'runtime-0.2.1 was not extracted.' }

      - uses: actions/upload-artifact@v4
        with:
          name: TNS-Tool-Compiler-Windows-x64-v3
          path: dist/TNS-Tool-Compiler-Windows-x64.exe
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish self-healing Windows + Linux compiler v3
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download Windows compiler
        uses: actions/download-artifact@v4
        with:
          name: TNS-Tool-Compiler-Windows-x64-v3
          path: dist

      - name: Reuse validated Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: TNS-Tool-Compiler-Linux-x64
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Build release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          files=[]
          for p in sorted(Path('dist').iterdir()):
              if not p.is_file(): continue
              data=p.read_bytes()
              files.append({'name':p.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          assert any(x['name'].endswith('.exe') for x in files), files
          assert any(x['name'].endswith('.AppImage') for x in files), files
          Path('dist/compiler-manifest.json').write_text(json.dumps({
              'version':3,
              'bridgeProtocol':2,
              'bridgeVersion':'0.2.1',
              'runtimeVersion':'runtime-0.2.1',
              'ndless':'r2022',
              'armToolchain':'14.3.rel1',
              'windowsMode':'background-gui-self-healing',
              'files':files,
          }, indent=2))
          print(json.dumps(files, indent=2))
          PY

      - name: Publish self-contained compiler release v3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$COMPILER_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$COMPILER_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$COMPILER_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'TNS Tool Compiler v3' \
            --notes 'Self-contained Ndless compiler with Windows in-place migration from older 0.2.0 installs. It replaces the stale local server, uses a fresh runtime-0.2.1, runs without console windows, receives project.zip from the web IDE, and returns a real Modern Zehn .tns.'
          gh release upload "$COMPILER_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
