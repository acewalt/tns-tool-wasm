name: Ndless official Build TNS flow

on:
  push:
    branches: [main]
    paths:
      - 'web/ndless-build-confirm-flow.js'
      - 'web/ndless-web-bridge.js'
      - 'web/container-editor-bindings.js'
      - 'web/multi-image-upload.js'
      - '.github/workflows/ndless-official-build-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check web/ndless-build-confirm-flow.js
          node --check web/ndless-web-bridge.js
          node --check web/container-editor-bindings.js
          node --check web/multi-image-upload.js
      - name: Verify dedicated web bridge routing
        run: |
          grep -F '127.0.0.1:34983' web/ndless-web-bridge.js
          grep -F 'ndlessweb://start' web/ndless-web-bridge.js
          grep -F 'ndless-web-compiler-v1' web/ndless-web-bridge.js
          grep -F 'Ndless-Web-Compiler-Windows-x64.exe' web/ndless-web-bridge.js
          grep -F 'web/ndless-web-bridge.js' web/container-editor-bindings.js
          grep -F 'web/ndless-build-confirm-flow.js' web/container-editor-bindings.js
      - name: Verify first-run confirmation is inside compiler step
        run: |
          grep -F 'data-build-step1-prompt' web/ndless-build-confirm-flow.js
          grep -F '¿Ya se descargó Ndless-Web-Compiler-Windows-x64.exe?' web/ndless-build-confirm-flow.js
          grep -F 'Ahora abre el EXE desde Descargas' web/ndless-build-confirm-flow.js
          grep -F 'Ya lo abrí' web/ndless-build-confirm-flow.js
          grep -F 'project.zip' web/ndless-build-confirm-flow.js
          grep -F 'NdlessLocalBridge.build(project' web/ndless-build-confirm-flow.js
      - name: Verify experimental Ndless button is retired
        run: |
          grep -F 'ndless-save-experimental-button' web/ndless-build-confirm-flow.js
          grep -F 'dataset.experimentalSaveDirect="1"' web/ndless-build-confirm-flow.js
