name: Ndless official Build TNS flow

on:
  push:
    branches: [main]
    paths:
      - 'ndless-build-confirm-flow.js'
      - 'ndless-local-runtime-v4.js'
      - 'container-editor-bindings.js'
      - 'multi-image-upload.js'
      - '.github/workflows/ndless-official-build-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check ndless-build-confirm-flow.js
          node --check ndless-local-runtime-v4.js
          node --check container-editor-bindings.js
          node --check multi-image-upload.js
      - name: Verify confirmed compiler routing
        run: |
          grep -F 'tns-tool-compiler-v4' ndless-local-runtime-v4.js
          grep -F 'version:"0.2.2"' ndless-local-runtime-v4.js
          grep -F 'ndless-local-runtime-v4.js' container-editor-bindings.js
          grep -F 'ndless-build-confirm-flow.js' container-editor-bindings.js
          grep -F 'Sí, ya se descargó' ndless-build-confirm-flow.js
          grep -F 'openLocalCompiler' ndless-build-confirm-flow.js
          grep -F 'project.zip' ndless-build-confirm-flow.js
          grep -F 'bridge.build(project' ndless-build-confirm-flow.js
          grep -F 'downloadTns(result)' ndless-build-confirm-flow.js
      - name: Verify experimental Ndless button is retired
        run: |
          grep -F 'ndless-save-experimental-button' ndless-build-confirm-flow.js
          grep -F 'dataset.experimentalSaveDirect = "1"' ndless-build-confirm-flow.js