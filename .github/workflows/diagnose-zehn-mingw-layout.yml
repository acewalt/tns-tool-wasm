name: Diagnose MinGW Zehn layout

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-zehn-mingw-layout.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
      - name: Check Zehn struct layout
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cat > /tmp/zehn-layout.cpp <<'CPP'
          #include <cstdint>
          #include <cstdio>
          enum class Zehn_reloc_type : uint8_t { ADD_BASE=0, ADD_BASE_GOT, SET_ZERO, FILE_COMPRESSED, UNALIGNED_RELOC };
          enum class Zehn_flag_type : uint8_t { NDLESS_VERSION_MIN=0, NDLESS_VERSION_MAX, NDLESS_REVISION_MIN, NDLESS_REVISION_MAX, RUNS_ON_COLOR, RUNS_ON_CLICKPAD, RUNS_ON_TOUCHPAD, RUNS_ON_32MB, EXECUTABLE_NAME, EXECUTABLE_AUTHOR, EXECUTABLE_VERSION, EXECUTABLE_NOTICE, RUNS_ON_HWW, USES_LCD_BLIT };
          struct Zehn_header { uint32_t signature, version, file_size, reloc_count, flag_count, extra_size, alloc_size, entry_offset; } __attribute__((packed));
          struct Zehn_reloc { Zehn_reloc_type type : 8; uint32_t offset : 24; } __attribute__((packed));
          struct Zehn_flag { Zehn_flag_type type : 8; uint32_t data : 24; } __attribute__((packed));
          int main() {
            Zehn_reloc r{Zehn_reloc_type::FILE_COMPRESSED, 0};
            Zehn_flag f{Zehn_flag_type::EXECUTABLE_VERSION, 0x123456};
            printf("header=%zu reloc=%zu flag=%zu\n", sizeof(Zehn_header), sizeof(Zehn_reloc), sizeof(Zehn_flag));
            auto *rb = reinterpret_cast<unsigned char*>(&r);
            auto *fb = reinterpret_cast<unsigned char*>(&f);
            printf("reloc bytes:"); for (size_t i=0;i<sizeof(r);++i) printf(" %02X", rb[i]); puts("");
            printf("flag bytes:"); for (size_t i=0;i<sizeof(f);++i) printf(" %02X", fb[i]); puts("");
            return 0;
          }
          CPP
          echo '--- default MinGW ABI ---'
          g++ /tmp/zehn-layout.cpp -o /tmp/zehn-layout.exe
          /tmp/zehn-layout.exe
          echo '--- with -mno-ms-bitfields ---'
          g++ -mno-ms-bitfields /tmp/zehn-layout.cpp -o /tmp/zehn-layout-noms.exe
          /tmp/zehn-layout-noms.exe
