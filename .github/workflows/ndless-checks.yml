name: TNS structured checks

on:
  push:
    branches: [main]
    paths:
      - 'web/ndless-*.js'
      - 'web/ndless-*.css'
      - 'web/tns-*.js'
      - 'web/content-pack-*.js'
      - 'web/content-pack-*.css'
      - 'web/structured-content-*.js'
      - 'web/structured-content-*.css'
      - 'web/container-editor-bindings.js'
      - 'web/nzp-*.js'
      - 'web/nvp-*.js'
      - 'web/nvp-*.css'
      - 'tests/ndless-*.test.js'
      - 'tests/custom-content-*.test.js'
      - 'web/multi-image-upload.js'
      - 'index.html'
      - 'web/app.js'
      - 'web/prgm-preview.*'
      - 'web/ti-program-editor-preview.*'
      - 'src/prgm/**'
      - 'src/api/index.js'
      - 'cli/tns-tool.js'
      - 'tests/prgm-preview.test.js'
      - 'examples/physics-prgm.tib'
      - 'web/theme-transition-toggle.js'
      - 'tests/theme-transition-toggle.test.js'
      - 'web/ti-calculator-transfer.js'
      - 'web/ti-nspire-webusb.js'
      - 'web/ti-calculator-transfer.css'
      - 'tools/calculator-transfer/**'
      - 'tests/calculator-transfer-ui.test.js'
      - 'tests/test_calculator_bridge.py'
      - '.github/workflows/ndless-checks.yml'
  pull_request:
    paths:
      - 'web/ndless-*.js'
      - 'web/ndless-*.css'
      - 'web/tns-*.js'
      - 'web/content-pack-*.js'
      - 'web/content-pack-*.css'
      - 'web/structured-content-*.js'
      - 'web/structured-content-*.css'
      - 'web/container-editor-bindings.js'
      - 'web/nzp-*.js'
      - 'web/nvp-*.js'
      - 'web/nvp-*.css'
      - 'tests/ndless-*.test.js'
      - 'tests/custom-content-*.test.js'
      - 'web/multi-image-upload.js'
      - 'index.html'
      - 'web/app.js'
      - 'web/prgm-preview.*'
      - 'web/ti-program-editor-preview.*'
      - 'src/prgm/**'
      - 'src/api/index.js'
      - 'cli/tns-tool.js'
      - 'tests/prgm-preview.test.js'
      - 'examples/physics-prgm.tib'
      - 'web/theme-transition-toggle.js'
      - 'tests/theme-transition-toggle.test.js'
      - 'web/ti-calculator-transfer.js'
      - 'web/ti-nspire-webusb.js'
      - 'web/ti-calculator-transfer.css'
      - 'tools/calculator-transfer/**'
      - 'tests/calculator-transfer-ui.test.js'
      - 'tests/test_calculator_bridge.py'
      - '.github/workflows/ndless-checks.yml'

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI Python dependency
        run: python -m pip install --disable-pip-version-check pycryptodome
      - name: Syntax check
        run: |
          node --check web/tns-container-registry.js
          node --check web/tns-universal-detector.js
          node --check web/tns-type-detection-progress.js
          node --check web/nzp-content-format.js
          node --check web/nvp-video-format.js
          node --check web/content-pack-editor.js
          node --check web/structured-content-editor.js
          node --check web/nvp-editor.js
          node --check web/container-editor-bindings.js
          node --check web/ndless-analysis.js
          node --check web/ndless-analysis-worker.js
          node --check web/ndless-arm-decoder.js
          node --check web/ndless-arm-runtime.js
          node --check web/ndless-arm-runtime-v2.js
          node --check web/ndless-bflt.js
          node --check web/ndless-editor.js
          node --check web/ndless-friendly-core.js
          node --check web/ndless-friendly-editor.js
          node --check web/ndless-format-detector.js
          node --check web/ndless-inspector-editor-link.js
          node --check web/ndless-prg.js
          node --check web/ndless-rebuilder.js
          node --check web/ndless-tns-inspector.js
          node --check web/ndless-zehn.js
          node --check web/ndless-zehn-stream-fix.js
          node --check web/ndless-elf32.js
          node --check web/ndless-zehn-builder.js
          node --check web/ndless-build-worker.js
          node --check web/ndless-build-manager.js
          node --check web/ndless-build-coi.js
          node --check ndless-coi-sw.js
          node --check web/ndless-build-ui.js
          node --check web/ndless-project-core.js
          node --check web/ndless-project-core-enhancements.js
          node --check web/ndless-project-folder-build.js
          node --check web/ndless-project-workspace.js
          node --check web/ndless-project-sdk-enhancements.js
          node --check web/ndless-project-sdk-enhancements-v2.js
          node --check web/ndless-project-file-tree.js
          node --check web/ndless-local-runtime-upgrade.js
          node --check web/ndless-experimental-export-fix.js
          node --check web/multi-image-upload.js
          node --check web/ti-calculator-transfer.js
          node --check web/ti-nspire-webusb.js
          python -m py_compile tools/calculator-transfer/bridge.py tests/test_calculator_bridge.py
      - name: Circular theme reveal regression tests
        run: node tests/theme-transition-toggle.test.js
      - name: Calculator transfer regression tests
        run: |
          node tests/calculator-transfer-ui.test.js
          python -m unittest discover -s tests -p 'test_calculator_bridge.py'
      - name: Structured content tests
        run: node tests/custom-content-formats.test.js
      - name: Ndless synthetic tests
        run: |
          node tests/ndless-formats.test.js
          node tests/ndless-reachable.test.js
          node tests/ndless-friendly.test.js
          node tests/ndless-export-roundtrip.test.js
          node tests/ndless-zehn-stream-fix.test.js
          node tests/ndless-project.test.js
          node tests/ndless-project-tree.test.js
          node tests/ndless-zehn-builder.test.js
          node tests/ndless-experimental-export-fix.test.js
          node tests/ndless-local-runtime-upgrade.test.js
          node tests/ndless-arm-runtime.test.js
      - name: General smoke tests
        run: node tests/smoke.test.js
      - name: TI-BASIC Prgm preview
        run: node --test tests/prgm-preview.test.js
      - name: Math tools and graphical preview regressions
        run: |
          node --test tests/ti-basic-math.test.js tests/ti-basic-cas-session.test.js tests/ti-math-typeset.test.js tests/program-editor-tools.test.js tests/catalog-hierarchy-v31.test.js tests/prgm-drawing.test.js
          node tests/calculator-usb-help.test.js
          python -m unittest discover -s tests -p 'test_ti_*syntax.py'
          python -m unittest discover -s tests -p 'test_ti_catalog_units.py'
          python -m unittest discover -s tests -p 'test_ti_internal_programs.py'
          python -m unittest discover -s tests -p 'test_prgm_drawing_syntax.py'
          node --test tests/prgm-subroutines.test.js tests/prgm-sonar-math.test.js tests/prgm-graphics-checkpoint.test.js tests/program-symbol-tools.test.js tests/prgm-calculator-session.test.js tests/editor-commands-v33.test.js tests/catalog-variables-v33.test.js tests/math-toolbar-v34.test.js tests/ti-program-editor-preview.test.js tests/program-editor-integration-v35.test.js tests/document-element-delete.test.js
          python -m unittest discover -s tests -p 'test_program_editor_visibility.py'
          python -m unittest discover -s tests -p 'test_document_element_delete.py'
      - name: CLI e2e tests
        run: node tests/e2e.test.js
