name: TNS structured checks

on:
  push:
    branches: [main]
    paths:
      - 'ndless-*.js'
      - 'ndless-*.css'
      - 'tns-*.js'
      - 'content-pack-*.js'
      - 'content-pack-*.css'
      - 'structured-content-*.js'
      - 'structured-content-*.css'
      - 'container-editor-bindings.js'
      - 'nzp-*.js'
      - 'nvp-*.js'
      - 'nvp-*.css'
      - 'tests/ndless-*.test.js'
      - 'tests/custom-content-*.test.js'
      - 'multi-image-upload.js'
      - 'index.html'
      - '.github/workflows/ndless-checks.yml'
  pull_request:
    paths:
      - 'ndless-*.js'
      - 'ndless-*.css'
      - 'tns-*.js'
      - 'content-pack-*.js'
      - 'content-pack-*.css'
      - 'structured-content-*.js'
      - 'structured-content-*.css'
      - 'container-editor-bindings.js'
      - 'nzp-*.js'
      - 'nvp-*.js'
      - 'nvp-*.css'
      - 'tests/ndless-*.test.js'
      - 'tests/custom-content-*.test.js'
      - 'multi-image-upload.js'
      - 'index.html'
      - '.github/workflows/ndless-checks.yml'

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI Python dependency
        run: python -m pip install --disable-pip-version-check pycryptodome
      - name: Syntax check
        run: |
          node --check tns-container-registry.js
          node --check tns-universal-detector.js
          node --check tns-type-detection-progress.js
          node --check nzp-content-format.js
          node --check nvp-video-format.js
          node --check content-pack-editor.js
          node --check structured-content-editor.js
          node --check nvp-editor.js
          node --check container-editor-bindings.js
          node --check ndless-analysis.js
          node --check ndless-analysis-worker.js
          node --check ndless-arm-decoder.js
          node --check ndless-arm-runtime.js
          node --check ndless-bflt.js
          node --check ndless-editor.js
          node --check ndless-friendly-core.js
          node --check ndless-friendly-editor.js
          node --check ndless-format-detector.js
          node --check ndless-inspector-editor-link.js
          node --check ndless-prg.js
          node --check ndless-rebuilder.js
          node --check ndless-tns-inspector.js
          node --check ndless-zehn.js
          node --check ndless-zehn-stream-fix.js
          node --check ndless-elf32.js
          node --check ndless-zehn-builder.js
          node --check ndless-build-worker.js
          node --check ndless-build-manager.js
          node --check ndless-build-coi.js
          node --check ndless-coi-sw.js
          node --check ndless-build-ui.js
          node --check ndless-project-core.js
          node --check ndless-project-core-enhancements.js
          node --check ndless-project-folder-build.js
          node --check ndless-project-workspace.js
          node --check ndless-project-sdk-enhancements.js
          node --check ndless-project-sdk-enhancements-v2.js
          node --check ndless-project-file-tree.js
          node --check ndless-local-runtime-upgrade.js
          node --check ndless-experimental-export-fix.js
          node --check multi-image-upload.js
      - name: Structured content tests
        run: node tests/custom-content-formats.test.js
      - name: Ndless synthetic tests
        run: |
          node tests/ndless-formats.test.js
          node tests/ndless-reachable.test.js
          node tests/ndless-friendly.test.js
          node tests/ndless-export-roundtrip.test.js
          node tests/ndless-zehn-stream-fix.test.js
          node tests/ndless-project.test.js
          node tests/ndless-project-tree.test.js
          node tests/ndless-zehn-builder.test.js
          node tests/ndless-experimental-export-fix.test.js
          node tests/ndless-local-runtime-upgrade.test.js
          node tests/ndless-arm-runtime.test.js
      - name: General smoke tests
        run: node tests/smoke.test.js
      - name: CLI e2e tests
        run: node tests/e2e.test.js
