name: Browser ROM Converter
on:
  push:
    branches: [main]
    paths: ['rom-*.js', 'assets/rom/**', 'tests/rom-web.test.cjs', 'tests/fixtures/rom-web/**', '.github/workflows/rom-web-checks.yml']
  pull_request:
    paths: ['rom-*.js', 'assets/rom/**', 'tests/rom-web.test.cjs', 'tests/fixtures/rom-web/**', '.github/workflows/rom-web-checks.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/rom-web.test.cjs
