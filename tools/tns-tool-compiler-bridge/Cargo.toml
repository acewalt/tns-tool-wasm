[package]
name = "tns-tool-compiler-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Loopback compiler bridge for TNS Tool WASM"

[dependencies]
base64 = "0.22"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.21"
tiny_http = "0.12"
walkdir = "2.5"
which = "8.0"
