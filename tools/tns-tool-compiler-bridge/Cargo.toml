[package]
name = "tns-tool-compiler-bridge"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Self-contained local Ndless compiler for TNS Tool"

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.21"
tiny_http = "0.12"
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
